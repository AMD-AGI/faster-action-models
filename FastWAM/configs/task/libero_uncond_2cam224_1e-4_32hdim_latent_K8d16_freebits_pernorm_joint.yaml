# @package _global_
# 32-hidden-dim + K8/d16 free-bits VAE + per-suite normalization.
defaults:
  - override /data: libero_2cam
  - override /model: fastwam_32hdim_latent_b4_joint
  - _self_

batch_size: 64
num_workers: 8

# Training data locations, relative to FastWAM/ (where the training scripts run). Override any of them on the
# command line, e.g. `libero_data_root=/dev/shm` to read datasets staged in RAM (docs/cae-fastwam-libero.md).
#   libero_data_root       holds libero_{spatial,object,goal,10}_no_noops_lerobot, extracted from the
#                          yuanty/LIBERO-fastwam tarballs (LeRobot 2.1, as in data/libero_2cam.yaml)
#   per_suite_stats_dir    libero_{suite}.json per-suite statistics (amd/CAE-FastWAM stats/)
#   text_embeds_cache_dir  scripts/precompute_text_embeds.py output for this task
libero_data_root: ./data/libero_mujoco3.3.2
per_suite_stats_dir: ../checkpoints/CAE-FastWAM/stats
text_embeds_cache_dir: ./data/text_embeds_cache/libero

data:
  train:
    dataset_dirs:
      - ${libero_data_root}/libero_spatial_no_noops_lerobot
      - ${libero_data_root}/libero_object_no_noops_lerobot
      - ${libero_data_root}/libero_goal_no_noops_lerobot
      - ${libero_data_root}/libero_10_no_noops_lerobot
    per_dataset_norm_stats:
      - ${per_suite_stats_dir}/libero_spatial.json
      - ${per_suite_stats_dir}/libero_object.json
      - ${per_suite_stats_dir}/libero_goal.json
      - ${per_suite_stats_dir}/libero_10.json
    text_embedding_cache_dir: ${text_embeds_cache_dir}

model:
  mot_checkpoint_mixed_attn: false
  action_vae_ckpt: checkpoints/cascade/vae_approachB/vae_B4_allsuites_softprompt_pernorm_freebits_K8_dz16.pt
  loss:
    lambda_video: 1.0

lr_scheduler_type: "cosine"
learning_rate: 1e-4
num_epochs: 10
max_steps: null
log_every: 10
save_every: 2000
eval_every: 200

gradient_accumulation_steps: 1
weight_decay: 1e-2
resume: null
